name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tk
          POSTGRES_PASSWORD: tk
          POSTGRES_DB: tablekeeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tk:tk@localhost:5432/tablekeeper_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: app
        run: npm ci || npm install

      - name: Enable btree_gist + migrate
        working-directory: app
        run: |
          PGPASSWORD=tk psql -h localhost -U tk -d tablekeeper_test \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          npm run db:migrate

      - name: Lint
        working-directory: app
        run: npm run lint --if-present

      - name: Unit tests
        working-directory: app
        run: npm test -- --run

      - name: Invariant & concurrency suite (the hard part)
        working-directory: app
        run: npm run test:invariants

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit
